<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111318" />
  <title>Sem conexão | Nacar Distribuição</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#111318,#25272c);font-family:Arial,sans-serif;color:#17191e}.card{width:min(520px,100%);padding:38px;border-radius:24px;background:#fff;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.28)}.badge{display:inline-flex;padding:7px 12px;border-radius:999px;background:#fff1eb;color:#f15a24;font-weight:800;font-size:12px;letter-spacing:.08em}.icon{font-size:48px;margin:18px 0 8px}h1{margin:0 0 10px;font-size:30px}p{color:#667085;line-height:1.55;margin:0 0 22px}button{border:0;border-radius:12px;padding:13px 20px;background:#f15a24;color:#fff;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">NACAR DISTRIBUIÇÃO</span>
    <div class="icon">📡</div>
    <h1>Você está sem conexão</h1>
    <p>Reconecte-se à internet para acessar dados, pedidos, visitas e rotas atualizadas. Nenhuma informação autenticada foi armazenada nesta tela.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
